{% extends "base.html" %}

{% block content %}

<h2>📷 Live Preview</h2>

<div class="preview-page">

    <div class="preview-panel">

        {% if profile == "full" %}
        
        <img
            class="preview-image"
            src="/stream.mjpg"
            alt="Live Preview">
        
        {% else %}
        
        <img
            id="lite-preview"
            class="preview-image"
            alt="Preview">
        
        <button type="button" onclick="refreshLitePreview()">
            Refresh Preview
        </button>
        
        {% endif %}

    </div>

    <div class="preview-controls">

        <button onclick="captureStill()">
            📷 Capture Still
        </button>

        {% if profile == "full" %}
 

        <button onclick="recordClip()">
            🎥 Record Clip
        </button>

        <button
            id="motion-button"
            onclick="toggleMotion()">
            🚨 Motion
        </button>

        {% endif %}
        
        <button id="orientation-button"
                onclick="rotateOrientation()">
        🧭 Orientation: 0°
        </button>

    </div>

    <div class="status-card">

        <h3>Camera Status</h3>

        <table class="status-table">

            <tr>
                <td>Motion</td>
                <td id="motion-status">
                    Loading...
                </td>
            </tr>

            <tr>
                <td>Recording</td>
                <td id="recording-status">
                    Loading...
                </td>
            </tr>

            <tr>
                <td>Images</td>
                <td id="image-count">
                    --
                </td>
            </tr>

            <tr>
                <td>Videos</td>
                <td id="video-count">
                    --
                </td>
            </tr>

            <tr>
                <td>Last Motion</td>
                <td id="last-motion">
                    --
                </td>
            </tr>

            <tr>
                <td>Disk Free</td>
                <td id="disk-free">
                    --
                </td>
            </tr>

        </table>

    </div>

</div>

<script>

"use strict";

function captureStill(){

    fetch("/api/capture_still",{
        method:"POST"
    });

}

function recordClip(){

    fetch("/api/record_clip",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            duration:30
        })

    });

}

async function toggleMotion(){

    const response = await fetch("/api/status");
    const status = await response.json();

    const mode = status.motion_enabled ? "off" : "on";

    await fetch("/api/motion", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            mode: mode
        })

    });

    updatePreviewStatus();

}

async function setOrientation(){

    const angle =
        parseInt(
            document.getElementById("orientation").value
        );

    await fetch("/api/orientation",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            orientation:angle
        })

    });

}

let orientation = 0;

async function rotateOrientation(){

    orientation += 90;

    if(orientation > 270)
        orientation = 0;

    await fetch("/api/orientation",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            orientation:orientation
        })

    });

    updateOrientationButton();

}

function updateOrientationButton(){

    document.getElementById("orientation-button").innerText =
        "🧭 Orientation: " + orientation + "°";

}

function refreshLitePreview() {

    const image = document.getElementById("lite-preview");

    if (!image) {
        return;
    }

    image.src =
        "/snapshot.jpg?t=" + Date.now();
}

async function updatePreviewStatus(){

	console.log("Updating preview status");

    try{

        const response = await fetch("/api/status");
        console.log("HTTP", response.status);
		const data = await response.json();
		console.log(data);
        document.getElementById("motion-status").textContent =
            data.motion_enabled ? "🟢 Enabled" : "⚪ Disabled";

        document.getElementById("recording-status").textContent =
            data.recording ? "🔴 Recording" : "⚪ Idle";

        document.getElementById("image-count").textContent =
            data.image_count;
            
        document.getElementById("video-count").textContent =
            data.video_count;
            

        document.getElementById("last-motion").textContent =
            data.last_motion || "--";
            
        document.getElementById("disk-free").textContent =
            data.disk_free_gb.toFixed(1) + " GB";    

        const motionButton =
            document.getElementById("motion-button");
        
        if (motionButton) {
            motionButton.textContent =
                data.motion_enabled ?
                    "🚨 Disable Motion" :
                    "🚨 Enable Motion";
        }

		document.getElementById("orientation").value =
		    status.orientation;

    }
    catch(err){

        console.error(err);

    }

}

updatePreviewStatus();

setInterval(updatePreviewStatus,2000);

</script>

{% endblock %}
