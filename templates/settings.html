{% extends "base.html" %}

{% block content %}

<h1>⚙ Camera Settings</h1>

<form method="POST">

<div class="settings-section">

    <h2>Motion Detection</h2>

    <div class="setting-row">
        <label>Motion Area</label>
        <input
            type="number"
            name="motion_area"
            value="{{ settings.motion_area }}">
    </div>

    <div class="setting-row">
        <label>Frames Required</label>
        <input
            type="number"
            name="motion_frames_required"
            value="{{ settings.motion_frames_required }}">
    </div>

    <div class="setting-row">
        <label>Cooldown (seconds)</label>
        <input
            type="number"
            name="motion_cooldown"
            value="{{ settings.motion_cooldown }}">
    </div>

</div>

<hr>

<div class="settings-section">

   <h2>Image Quality</h2>
   
   <div class="setting-row">
       <label>Brightness</label>
   
       <input
           type="range"
           name="brightness"
           min="-1"
           max="1"
           step="0.1"
           value="{{ settings.brightness }}"
           oninput="brightnessValue.textContent=this.value">
   
       <span id="brightnessValue">
           {{ settings.brightness }}
       </span>
   </div>
   
   <div class="setting-row">
       <label>Contrast</label>
   
       <input
           type="range"
           name="contrast"
           min="0"
           max="3"
           step="0.1"
           value="{{ settings.contrast }}"
           oninput="contrastValue.textContent=this.value">
   
       <span id="contrastValue">
           {{ settings.contrast }}
       </span>
   </div>
   
   <div class="setting-row">
       <label>Saturation</label>
   
       <input
           type="range"
           name="saturation"
           min="0"
           max="3"
           step="0.1"
           value="{{ settings.saturation }}"
           oninput="saturationValue.textContent=this.value">
   
       <span id="saturationValue">
           {{ settings.saturation }}
       </span>
   </div>
   
   <div class="setting-row">
       <label>Sharpness</label>
   
       <input
           type="range"
           name="sharpness"
           min="0"
           max="5"
           step="0.1"
           value="{{ settings.sharpness }}"
           oninput="sharpnessValue.textContent=this.value">
   
       <span id="sharpnessValue">
           {{ settings.sharpness }}
       </span>
   </div>

   <div class="setting-row">
       <label>Exposure Compensation</label>
   
       <input
           type="range"
           name="exposure_value"
           min="-8"
           max="8"
           step="0.5"
           value="{{ settings.exposure_value }}"
           oninput="exposureValue.textContent=this.value">
   
       <span id="exposureValue">
           {{ settings.exposure_value }}
       </span>
   </div>

   <h2>Battery Mode</h2>
   
   <div class="setting-row">
   
   <label>Battery Mode</label>
   
   <input
       type="checkbox"
       name="battery_mode"
       {% if settings.battery_mode %}
       checked
       {% endif %}>
   
   </div>
   
   <div class="setting-row">
   
   <label>Preview Enabled</label>
   
   <input
       type="checkbox"
       name="preview_enabled"
       {% if settings.preview_enabled %}
       checked
       {% endif %}>
   
   </div>
   
   <div class="setting-row">
   
   <h2>Recording</h2>
   
   <label>
   
   Clip duration (seconds)
   
   <input
       type="range"
       name="clip_duration"
       min="5"
       max="30"
       value="{{ settings.clip_duration }}"
       oninput="this.nextElementSibling.value=this.value">
   
   <output>
   
   {{ settings.clip_duration }}
   
   </output>
   
   </label>

</div>

<p>

<button type="submit">
💾 Save Settings
</button>

</p>

</form>

<form action="/greenhouse-profile" method="post">

<button type="submit">

🌿 Apply Greenhouse Profile

</button>

</form>

{% endblock %}
