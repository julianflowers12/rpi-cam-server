{% extends "base.html" %}

{% block content %}

<style>

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:24px;
}

.card{
    background:#333;
    border-radius:12px;
    padding:12px;
}

.card img{
    width:100%;
    border-radius:8px;
}

.label{
    text-align:center;
    font-weight:bold;
    margin-top:10px;
}

.time{
    text-align:center;
    color:#bbb;
    font-size:13px;
    margin-top:4px;
}

.toolbar{

    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:20px;

}

.toolbar-item{

    display:flex;
    align-items:center;

}

.toolbar a{

    text-decoration:none;

}

button{

    width:auto;
    padding:10px 18px;
    border:none;
    border-radius:8px;
    background:#2f7ae5;
    color:white;
    cursor:pointer;
    font-size:15px;

}

button:hover{

    background:#1f63c4;

}

.card{
    transition:.2s;
}

.card img{
    width:100%;
    height:240px;
    object-fit:cover;
    border-radius:10px;
}

.label{

    display:inline-block;

    padding:4px 10px;

    border-radius:20px;

    font-size:13px;

    font-weight:bold;

    margin-top:10px;

    background:#eef4ff;

    color:#3366cc;
}

.card:hover{
    transform:translateY(-4px);
    box-shadow:0 6px 20px rgba(0,0,0,.18);
}

.lightbox{

    display:none;
    position:fixed;

    left:0;
    top:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.9);

    z-index:9999;

}

.lightbox img{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    max-width:90%;
    max-height:90%;

    border-radius:12px;

}

#close-lightbox{

    position:absolute;

    top:20px;
    right:30px;

    font-size:42px;

    color:white;

    cursor:pointer;

}

#prev-image,
#next-image{

    position:absolute;

    top:50%;

    transform:translateY(-50%);

    font-size:60px;

    color:white;

    cursor:pointer;

    user-select:none;

    padding:20px;

}

#prev-image{

    left:25px;

}

#next-image{

    right:25px;

}
</style>

<form method="get" style="margin-bottom:20px;">

<select name="date" onchange="this.form.submit()">

<option value="">All dates</option>

{% for d in available_dates %}

<option value="{{ d }}"
{% if d == selected_date %}selected{% endif %}>
{{ d[6:8] }}/{{ d[4:6] }}/{{ d[:4]}}
</option>

{% endfor %}

</select>

</form>

<form method="post" action="/delete-selected">

<div class="toolbar">

    <label class="toolbar-item">
        <input
            type="checkbox"
            onclick="toggleAll(this)">
        Select all
    </label>

    <a href="/download-all" class="toolbar-item">
        <button type="button">
            📦 Download All
        </button>
    </a>

	<button
		type="submit"
		formaction="/download-selected">
		⬇ Download Selected
	</button>

    <button
        type="submit"
        formaction="/delete-selected/"
        onclick="return confirm('Delete selected items?')">

        🗑 Delete Selected

    </button>

 
   

</div>

<div class="grid">

{% for event in events %}

<div class="card">

{% if event.type == "clip" %}

<a href="{{ event.link }}">

    <img src="{{ event.thumb }}" alt="">

</a>

{% else %}

<img
    class="gallery-image"
    src="{{ event.thumb }}"
    data-full="/media/{{ event.image_name }}?t={{ event.timestamp }}"
    alt="">

{% endif %}

<div class="label">
{{ event.label }}
</div>

<div class="time">
{{ event.date_text }}<br>
{{ event.time_text }}
</div>

<label>

<input
    type="checkbox"
    name="selected"
    value="{{ event.image_name }}">

Delete

</label>

</div>

{% endfor %}

</div>
</form>
<script>

function toggleAll(source){

    const boxes =
        document.getElementsByName("selected");

    for(let i=0;i<boxes.length;i++){

        boxes[i].checked = source.checked;

    }

}

</script>

<div id="lightbox" class="lightbox">

    <span id="close-lightbox">&times;</span>

    <span id="prev-image">&#10094;</span>

    <img id="lightbox-image">

    <span id="next-image">&#10095;</span>

</div>

<script>

const images =
    Array.from(document.querySelectorAll(".gallery-image"));

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightbox-image");

let current = 0;

function showImage(index){

    current = index;

    lightboxImage.src =
        images[index].dataset.full;

    lightbox.style.display = "block";

}

images.forEach((img,index)=>{

    img.onclick = function(){

        showImage(index);

    };

});

document.getElementById("close-lightbox")
.onclick=function(){

    lightbox.style.display="none";

};

lightbox.onclick=function(e){

    if(e.target===lightbox){

        lightbox.style.display="none";

    }

};

document.getElementById("prev-image")
.onclick=function(e){

    e.stopPropagation();

    current =
        (current-1+images.length)%images.length;

    showImage(current);

};

document.getElementById("next-image")
.onclick=function(e){

    e.stopPropagation();

    current =
        (current+1)%images.length;

    showImage(current);

};

document.addEventListener("keydown", function(e){

    if(lightbox.style.display !== "block")
        return;

    if(e.key === "ArrowRight"){

        current =
            (current + 1) % images.length;

        showImage(current);

    }

    if(e.key === "ArrowLeft"){

        current =
            (current - 1 + images.length)
            % images.length;

        showImage(current);

    }

    if(e.key === "Escape"){

        lightbox.style.display = "none";

    }

});

</script>

<div id="lightbox" class="lightbox">

    <span class="close">&times;</span>

    <img id="lightbox-img">

</div>

<script>

const lightbox=document.getElementById("lightbox");

const lightboxImg=document.getElementById("lightbox-img");

document.querySelectorAll(".gallery-image").forEach(img=>{

    img.onclick=()=>{

        lightbox.style.display="flex";

        lightboxImg.src=img.dataset.full;

    };

});

lightbox.onclick=()=>{

    lightbox.style.display="none";

};

document.addEventListener("keydown",e=>{

    if(e.key==="Escape"){

        lightbox.style.display="none";

    }

});

</script>



{% endblock %}
